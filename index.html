<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>PletLevelsList</title>

        <link rel="icon" href="./list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="./css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./css/typography.css" />
        <link rel="stylesheet" type="text/css" href="./css/main.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="./css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/components/tabs.css"
        />
        <!-- Supabase Client Library -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="./js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>PletLevelsList</h2>
                <p>v1.0.0</p>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <div class="nav__actions">
                    <!-- Theme Toggle -->
                    <button class="nav__icon" @click.prevent="store.toggleDark()">
                        <img :src="store.dark ? './assets/light.svg' : './assets/dark.svg'" alt="Toggle Theme" />
                    </button>

                    <!-- Discord Server Invite -->
                    <a class="nav__icon" href="https://discord.gg/kFJsSAupCp" target="_blank">
                        <img src="./assets/discord.svg" alt="Discord Logo" />
                    </a>

                    <!-- Profile Avatar & Logout (Shown when LOGGED IN) -->
                    <div v-if="store.user" style="display: flex; align-items: center; gap: 10px;">
                        <img 
                            :src="store.user.user_metadata.avatar_url" 
                            alt="Avatar" 
                            style="width: 32px; height: 32px; border-radius: 50%;" 
                        />
                        <button class="nav__cta type-label-lg" @click="logout" style="background: #e74c3c; border: none; cursor: pointer;">
                            Logout
                        </button>
                    </div>

                    <!-- Discord Login Button (Shown when LOGGED OUT) -->
                    <button v-else class="nav__cta type-label-lg" @click="loginWithDiscord" style="border: none; cursor: pointer;">
                        Login with Discord
                    </button>

                    <!-- Submit Record Button (ONLY SHOWN WHEN LOGGED IN) -->
                    <button 
                        v-if="store.user" 
                        class="nav__cta type-label-lg" 
                        @click="showSubmitModal = true" 
                        style="border: none; cursor: pointer;"
                    >
                        Submit Record
                    </button>
                </div>
            </nav>
        </header>

        <!-- Record Submission Modal -->
        <div 
            v-if="showSubmitModal && store.user" 
            style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000;" 
            @click.self="showSubmitModal = false"
        >
            <div style="background: #1e1e1e; padding: 30px; border-radius: 12px; width: 400px; color: #fff;">
                <h3 style="margin-bottom: 20px; font-size: 20px; font-weight: bold;">Submit Level Record</h3>

                <form @submit.prevent="submitRecord" style="display: flex; flex-direction: column; gap: 12px;">
                    <label>Level Name:</label>
                    <input v-model="form.level_name" required type="text" placeholder="e.g. Bloodlust" style="padding: 8px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff;" />

                    <label>Refresh Rate (Hz):</label>
                    <input v-model.number="form.hz" required type="number" min="1" placeholder="240" style="padding: 8px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff;" />

                    <label>Percentage (%):</label>
                    <input v-model.number="form.percentage" required type="number" min="1" max="100" placeholder="100" style="padding: 8px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff;" />

                    <label>YouTube Link:</label>
                    <input v-model="form.video_url" required type="url" placeholder="https://youtube.com/watch?v=..." style="padding: 8px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff;" />

                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button type="submit" class="nav__cta type-label-lg" :disabled="submitting" style="border: none; cursor: pointer;">
                            {{ submitting ? 'Submitting...' : 'Submit' }}
                        </button>
                        <button type="button" class="nav__cta type-label-lg" @click="showSubmitModal = false" style="background: #555; border: none; cursor: pointer;">
                            Cancel
                        </button>
                    </div>
                    <p v-if="submitMessage" style="margin-top: 10px; font-size: 14px; color: #2ecc71;">{{ submitMessage }}</p>
                </form>
            </div>
        </div>

        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
